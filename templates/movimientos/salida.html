{% extends "base.html" %}
{% block titulo %}Salida FEFO{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4"><i class="bi bi-box-arrow-right"></i> Registrar salida</h1>
      <p class="text-muted">El sistema sugerirá el lote con vencimiento más próximo (FEFO) y su ubicación.</p>
      <form method="post">{% csrf_token %}{% include "partials/campos.html" %}
        <button class="btn btn-ism btn-lg w-100"><i class="bi bi-lightbulb"></i> Ver lote sugerido</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
