{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-box-seam display-4 text-success"></i>
          <h1 class="h4 mt-2 mb-0">Control de Almacenamiento e Inventario</h1>
          <p class="text-muted mb-0">ISM - Tacna</p>
        </div>
        <form method="post" novalidate>{% csrf_token %}
          {% include "partials/campos.html" %}
          <button class="btn btn-ism btn-lg w-100 mt-2"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
